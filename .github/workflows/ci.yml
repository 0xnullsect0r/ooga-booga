name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binaries
        run: cargo build --release

      - name: Smoke-test examples via oogac
        run: |
          ./target/release/oogac run examples/hello_world.ooga
          ./target/release/oogac run examples/factorial.ooga
          ./target/release/oogac run examples/fibonacci.ooga
          ./target/release/oogac run examples/loop_demo.ooga

      - name: Smoke-test ooga new + ooga run
        run: |
          ./target/release/ooga new smoke-test-project
          cd smoke-test-project
          ../target/release/ooga run
